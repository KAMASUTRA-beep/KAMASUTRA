<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collections Signature 2027 | KAMASUTRA</title>
<style>
:root{--gold:#d6b47d;--bg:#101015}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f5eee7;font-family:Arial,sans-serif}
header{text-align:center;padding:40px 15px;border-bottom:1px solid #665039}
.logo{font-size:clamp(28px,7vw,48px);letter-spacing:7px;color:var(--gold)}
small{letter-spacing:4px;color:#d8c3a8}
h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,56px);font-weight:normal}
nav a{color:var(--gold);text-decoration:none}
section{max-width:1250px;margin:auto;padding:45px 18px}
h2{font-family:Georgia,serif;font-size:32px;color:var(--gold)}
p{color:#c7bdb4;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px}
article{background:#1b1920;border:1px solid #554631;border-radius:8px;overflow:hidden}
.photo{height:205px;background:linear-gradient(140deg,#252027,#604d4a,#17141a);display:flex;align-items:center;justify-content:center;color:#d9b986;text-align:center;padding:12px;font-family:Georgia,serif;font-size:23px}
article img{width:100%;height:205px;object-fit:cover;display:block}
.info{padding:13px}
.info b{display:block;font-family:Georgia,serif;font-size:18px}
.info span{font-size:11px;color:var(--gold)}
footer{text-align:center;padding:40px 15px;border-top:1px solid #665039;color:#b4a69b}
</style>
</head>
<body>
<header>
<div class="logo">KAMASUTRA</div>
<small>MAISON DE CRÉATION</small>
<h1>Collections Signature 2027</h1>
<p>30 créations conceptuelles · Trois univers · Une signature</p>
<nav><a href="index.html">← Retour à l'accueil</a></nav>
</header>
<main id="catalogue"></main>
<footer>© KAMASUTRA · Collection conceptuelle · Produits non encore commercialisés</footer>
<script>
const groups=[
{title:"Noir Éternel",prefix:"noir",names:["Éclipse","Obsession","Silhouette","Volupté","Intrigue","Mirage","Fétiche","Charme","Nocturne","Impériale"],desc:"Dentelle noire, satin profond et élégance couture."},
{title:"Rose Sculpté",prefix:"rose",names:["Tendresse","Rêverie","Pétale","Émotion","Amour","Délice","Romance","Sérénité","Envoûtement","Confidence"],desc:"Tons poudrés, soie et broderies délicates."},
{title:"Éclat d’Or",prefix:"or",names:["Luminaire","Prestige","Impulsion","Sublime","Aura","Majesté","Signature","Élégance","Diamant","Divine"],desc:"Satin champagne, finitions dorées et éclat précieux."}
];
const root=document.getElementById("catalogue");
groups.forEach(g=>{
const s=document.createElement("section");
const h=document.createElement("h2");h.textContent=g.title;s.append(h);
const p=document.createElement("p");p.textContent=g.desc;s.append(p);
const grid=document.createElement("div");grid.className="grid";
g.names.forEach((name,i)=>{
const n=String(i+1).padStart(2,"0");
const card=document.createElement("article");
const img=document.createElement("img");
img.src=g.prefix+"-"+n+".png";
img.alt="Concept KAMASUTRA "+name;
img.loading="lazy";
img.onerror=()=>{const fallback=document.createElement("div");fallback.className="photo";fallback.textContent=name;img.replaceWith(fallback)};
const info=document.createElement("div");info.className="info";
const b=document.createElement("b");b.textContent=name;
const tag=document.createElement("span");tag.textContent="CONCEPT · "+n;
info.append(b,tag);card.append(img,info);grid.append(card);
});
s.append(grid);root.append(s);
});
</script>
</body>
</html>
